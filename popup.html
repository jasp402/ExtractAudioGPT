<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExtractAudioGPT</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><img class="brand-icon" src="assets/extractaudiogpt-icon.png" alt="ExtractAudioGPT" width="44" height="44"><div><h1>ExtractAudioGPT</h1><p>ChatGPT · Read Aloud</p></div></header>
    <section aria-labelledby="status-label">
      <h2 id="status-label">Automatic downloads</h2>
      <p>Automatically download audio when you play it in ChatGPT.</p>
      <fieldset><legend>Extension status</legend>
        <label><input type="radio" name="enabled" value="yes"> YES</label>
        <label><input type="radio" name="enabled" value="no"> NO</label>
      </fieldset>
      <label class="conversion-option"><input id="convertMp3" type="checkbox" checked> Convert to MP3</label>
      <p id="status" role="status" aria-live="polite">Loading settings…</p>
    </section>
    <footer>Created by <a href="https://github.com/jasp402/ExtractAudioGPT" target="_blank" rel="noopener noreferrer">jasp402</a> · v1.0.8 · 22db21f · <a href="https://github.com/jasp402/ExtractAudioGPT/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">Privacy</a> · <a href="https://github.com/jasp402/ExtractAudioGPT/issues/new/choose" target="_blank" rel="noopener noreferrer">Support</a></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
